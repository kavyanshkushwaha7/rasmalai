services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN to the approved production hostname}
        NEXT_PUBLIC_REALTIME_URL: ""
    env_file:
      - ${WEB_ENV_FILE:?Set WEB_ENV_FILE to the protected web runtime env file}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_SITE_URL: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN to the approved production hostname}
      SPECTATOR_MODE_ENABLED: "false"
    command: ["npm", "run", "start", "--workspace", "@rasmalai/web"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    volumes:
      - type: bind
        source: ${SUPABASE_CA_CERT_FILE:?Set SUPABASE_CA_CERT_FILE to the production Supabase CA file}
        target: /run/secrets/rasmalai-supabase-ca.crt
        read_only: true

  realtime:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN to the approved production hostname}
        NEXT_PUBLIC_REALTIME_URL: ""
    env_file:
      - ${REALTIME_ENV_FILE:?Set REALTIME_ENV_FILE to the protected realtime env file}
    environment:
      NODE_ENV: production
      REALTIME_HOST: 0.0.0.0
      REALTIME_PORT: "4100"
      NEXT_PUBLIC_SITE_URL: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN to the approved production hostname}
      REALTIME_ALLOWED_ORIGIN: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN to the approved production hostname}
      SPECTATOR_MODE_ENABLED: "false"
    command: ["npm", "run", "start", "--workspace", "@rasmalai/realtime"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - type: bind
        source: ${SUPABASE_CA_CERT_FILE:?Set SUPABASE_CA_CERT_FILE to the production Supabase CA file}
        target: /run/secrets/rasmalai-supabase-ca.crt
        read_only: true

  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN to the approved production hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      realtime:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
